<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>[hidden]{display:none!important} body{margin:0}</style>
</head>
<body>
<title>Pinlog Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --ink: #0f1a2b;
    --ink-2: #334155;
    --muted: #64748b;
    --paper: #f7f6f2;
    --panel: rgba(255, 255, 255, 0.92);
    --line: #e4e6eb;
    --pin: #f97316;
    --pin-deep: #c2410c;
    --day2: #2563eb;
    --ok: #15803d;
    --ok-bg: #e8f5ec;
    --warn: #b45309;
    --warn-bg: #fdf3e2;
    --water: #cfe3f5;
    --water-edge: #a9cbe8;
    --ground: #edeee8;
    --park: #dbe8d2;
    --studio: #0b1220;
    --studio-2: #141d2f;
    --studio-line: #243047;
    --studio-text: #e8edf5;
    --studio-muted: #8b99b3;
    --display: 'Bricolage Grotesque', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
    --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #d9d6ce; color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--pin); outline-offset: 2px; }
  img { max-width: 100%; display: block; }

  /* ---- stage: a phone on a desk; the same markup is the whole screen on a real phone ---- */
  .stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 28px; padding: 24px 16px; }
  .phone { position: relative; width: 390px; height: 844px; max-width: 100%; border-radius: 48px; background: #101418; padding: 12px; box-shadow: 0 40px 90px rgba(15, 26, 43, 0.35), inset 0 0 0 2px #2a3038; flex: none; }
  .phone::before { content: ''; position: absolute; top: 22px; left: 50%; width: 118px; height: 32px; transform: translateX(-50%); background: #101418; border-radius: 20px; z-index: 5; }
  .app { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: var(--paper); isolation: isolate; }
  .beats { width: 300px; flex: none; color: var(--ink); }
  .beats h1 { font-family: var(--display); font-size: 30px; line-height: 1; margin: 0 0 6px; letter-spacing: -0.02em; text-wrap: balance; }
  .beats .sub { color: var(--ink-2); margin: 0 0 18px; font-size: 13px; }
  .beats ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; counter-reset: beat; }
  .beat { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid rgba(15, 26, 43, 0.12); border-radius: 14px; background: rgba(255, 255, 255, 0.55); transition: background 0.15s, transform 0.15s; }
  .beat:hover { background: #fff; transform: translateX(2px); }
  .beat.done { border-color: var(--ok); }
  .beat .n { font-family: var(--mono); font-size: 12px; color: var(--pin-deep); padding-top: 2px; }
  .beat .t { font-weight: 600; }
  .beat .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .beat .say { color: var(--ink-2); font-size: 12px; margin-top: 4px; font-style: italic; }
  .beats .foot { margin-top: 16px; font-size: 12px; color: var(--muted); }
  .beats .foot code { font-family: var(--mono); font-size: 11px; }
  .topbar .demo-fab { display: none; }
  @media (max-width: 760px) {
    body { background: var(--paper); }
    .stage { padding: 0; gap: 0; min-height: 100dvh; align-items: stretch; }
    .beats { display: none; }
    .phone { width: 100%; height: 100dvh; max-width: none; padding: 0; border-radius: 0; box-shadow: none; }
    .phone::before { display: none; }
    .app { border-radius: 0; }
    .topbar .demo-fab { display: inline-flex; }
  }

  /* ---- chrome inside the app ---- */
  .topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 58px 14px 8px; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .brand { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 8px; border-radius: 999px; background: var(--panel); backdrop-filter: blur(8px); box-shadow: 0 2px 10px rgba(15, 26, 43, 0.08); font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pin); box-shadow: 0 0 0 3px #fff; }
  .badge { font-size: 11px; padding: 4px 9px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-weight: 600; white-space: nowrap; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 10px 22px; background: linear-gradient(180deg, rgba(247, 246, 242, 0) 0%, var(--paper) 30%); }
  .tab { display: grid; justify-items: center; gap: 3px; padding: 6px 4px; border: 0; background: transparent; border-radius: 12px; color: var(--muted); font-size: 11px; font-weight: 500; }
  .tab .ic { font-size: 20px; line-height: 1; }
  .tab.on { color: var(--ink); }
  .tab.on .ic { filter: drop-shadow(0 2px 6px rgba(249, 115, 22, 0.35)); }
  .screen { position: absolute; inset: 0; overflow: hidden; }
  .scroll { position: absolute; inset: 0; overflow-y: auto; padding: 110px 16px 110px; -webkit-overflow-scrolling: touch; }
  h2.title { font-family: var(--display); font-size: 28px; line-height: 1.02; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
  .lede { color: var(--ink-2); margin: 6px 0 0; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; border: 0; background: var(--pin); color: #fff; font-weight: 600; font-size: 14px; box-shadow: 0 6px 18px rgba(249, 115, 22, 0.35); }
  .btn.ghost { background: var(--panel); color: var(--ink); box-shadow: 0 2px 10px rgba(15, 26, 43, 0.1); backdrop-filter: blur(8px); }
  .btn.dark { background: var(--ink); box-shadow: 0 6px 18px rgba(15, 26, 43, 0.3); }
  .btn.sm { padding: 6px 11px; font-size: 12px; }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .chip { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  /* ---- trips ---- */
  .trip-card { display: block; width: 100%; text-align: left; margin-top: 14px; padding: 16px; border-radius: var(--radius); border: 1px solid var(--line); background: #fff; box-shadow: 0 2px 12px rgba(15, 26, 43, 0.05); }
  .trip-card .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .trip-card h3 { font-family: var(--display); font-size: 21px; margin: 0; letter-spacing: -0.02em; }
  .trip-card .st { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .trip-card .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .trip-card .meta span { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #f1f2f4; color: var(--ink-2); }
  .trip-card .meta .date { background: #fff2e8; color: var(--pin-deep); font-family: var(--mono); }
  .trip-card.new { border-style: dashed; background: rgba(255, 255, 255, 0.6); }
  .trip-card.new h3 { color: var(--pin-deep); }
  .strip { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }

  /* ---- map ---- */
  .map-wrap { position: absolute; inset: 0; }
  .map-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .map-head { position: absolute; top: 98px; left: 14px; right: 14px; z-index: 20; display: grid; gap: 8px; }
  .trip-pill { justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; background: var(--panel); backdrop-filter: blur(8px); box-shadow: 0 2px 10px rgba(15, 26, 43, 0.08); font-weight: 600; font-size: 13px; }
  .trip-pill .mono { color: var(--muted); font-weight: 400; font-size: 11px; }
  .fabs { position: absolute; right: 14px; bottom: 104px; z-index: 20; display: grid; gap: 8px; justify-items: end; }
  .tray-chip { position: absolute; left: 14px; bottom: 104px; z-index: 20; }
  .ticker { position: absolute; left: 14px; right: 14px; bottom: 104px; z-index: 25; padding: 12px 14px; border-radius: 16px; background: var(--panel); backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(15, 26, 43, 0.15); }
  .ticker .h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .ticker ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 5px; max-height: 150px; overflow: hidden; }
  .ticker li { font-size: 12px; display: grid; grid-template-columns: 14px 1fr; gap: 6px; }
  .ticker li .why { color: var(--muted); }
  .ticker li.drop { color: var(--muted); }
  .ticker li.drop b { text-decoration: line-through; }
  .ticker .foot { margin-top: 8px; font-size: 11px; color: var(--muted); }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #cbd5e1; border-top-color: var(--pin); animation: spin 0.8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pin-g { cursor: pointer; }
  .pin-g text { font-family: var(--body); font-weight: 700; font-size: 12px; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .pin-g .glyph { font-size: 13px; }
  .pin-g .badge-t { font-size: 9px; }
  .pin-g .lab { font-size: 11px; font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: auto; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .pin-g .now-t { font-family: var(--mono); font-size: 9px; fill: #fff; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.1s ease-out 3; }
  @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(3.2); opacity: 0; } }
  .river-lab { font-family: var(--mono); font-size: 9px; fill: #5b84ad; letter-spacing: 0.08em; text-transform: uppercase; }
  .fly { position: absolute; z-index: 60; width: 64px; height: 64px; border-radius: 12px; overflow: hidden; box-shadow: 0 14px 30px rgba(15, 26, 43, 0.35); pointer-events: none; }
  .fly img { width: 100%; height: 100%; object-fit: cover; }
  .attrib { position: absolute; right: 12px; bottom: 90px; z-index: 15; font-size: 9px; color: #6b7a90; font-family: var(--mono); background: rgba(247, 246, 242, 0.7); padding: 1px 5px; border-radius: 4px; }

  /* ---- sheets ---- */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 50; max-height: 66%; display: flex; flex-direction: column; background: #fff; border-radius: 24px 24px 0 0; box-shadow: 0 -12px 40px rgba(15, 26, 43, 0.22); animation: up 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #d4d8e0; margin: 8px auto 0; }
  .sheet .hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 8px 16px 10px; border-bottom: 1px solid var(--line); }
  .sheet .hd h3 { font-family: var(--display); font-size: 20px; margin: 2px 0 0; letter-spacing: -0.02em; line-height: 1.1; }
  .sheet .hd .k { font-size: 11px; color: var(--muted); }
  .sheet .x { border: 0; background: #f1f2f4; width: 30px; height: 30px; border-radius: 50%; flex: none; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { font-size: 10px; padding: 3px 7px; border-radius: 999px; background: #f1f2f4; color: var(--ink-2); font-weight: 600; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.mono { font-weight: 500; }
  .tabs { display: flex; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .body { overflow-y: auto; padding: 12px 16px 24px; }
  .why { padding: 10px 12px; border-radius: 12px; background: #fff4ea; color: var(--ink); }
  .why .k { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pin-deep); font-weight: 700; }
  .kv { margin-top: 10px; color: var(--ink-2); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ph { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #e5e7eb; }
  .ph img { width: 100%; height: 100%; object-fit: cover; }
  .ph .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.65)); color: #fff; font-size: 10px; display: flex; justify-content: space-between; }
  .note { padding: 10px 12px; border-radius: 12px; background: #f6f7f9; }
  .note + .note { margin-top: 8px; }
  .note .t { display: flex; justify-content: space-between; gap: 8px; }
  .note .m { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .bubble { max-width: 88%; padding: 9px 12px; border-radius: 16px; font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
  .bubble.u { margin-left: auto; background: var(--ink); color: #fff; border-bottom-right-radius: 6px; }
  .bubble.a { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .bubble.typing::after { content: '▍'; animation: blink 0.9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .compose { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: #fff; }
  .compose input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; font: inherit; font-size: 13px; }
  .quick { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px 0; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .hint { font-size: 11px; color: var(--muted); padding: 8px 10px; border-radius: 10px; background: #f6f7f9; }
  .tray-item { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); }
  .tray-item + .tray-item { margin-top: 8px; }
  .tray-item img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
  .tray-item .m { font-size: 11px; color: var(--muted); }
  .picker { margin-top: 8px; padding: 8px; border-radius: 10px; background: #f6f7f9; display: grid; gap: 2px; }
  .picker .d { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 4px 6px 2px; font-weight: 700; }
  .picker button { text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .picker button:hover { background: #fff; }

  /* ---- hud + toasts ---- */
  .hud { position: absolute; left: 12px; right: 12px; bottom: 96px; z-index: 55; display: grid; gap: 6px; pointer-events: none; }
  .land { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 14px; background: var(--panel); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(15, 26, 43, 0.2); animation: up 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .land img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
  .land .t { font-weight: 600; font-size: 13px; }
  .land .t .ok { color: var(--ok); }
  .land .t .tr { color: var(--warn); }
  .land .r { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .toasts { position: absolute; top: 100px; left: 12px; right: 12px; z-index: 70; display: grid; gap: 6px; pointer-events: none; }
  .toast { padding: 9px 12px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 12px; box-shadow: 0 10px 30px rgba(15, 26, 43, 0.3); animation: up 0.25s ease-out; }
  .toast.ok { background: var(--ok); }
  .toast .d { opacity: 0.8; font-size: 11px; margin-top: 2px; }

  /* ---- studio ---- */
  .studio { position: absolute; inset: 0; background: var(--studio); color: var(--studio-text); }
  .studio .scroll { padding-top: 104px; }
  .studio h2.title { color: #fff; }
  .studio .lede { color: var(--studio-muted); }
  .settings { display: grid; gap: 10px; margin-top: 14px; }
  .settings .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--studio-muted); }
  .settings .chip { background: var(--studio-2); border-color: var(--studio-line); color: var(--studio-text); }
  .settings .chip.on { background: var(--pin); border-color: var(--pin); color: #fff; }
  .settings input[type='range'] { flex: 1; accent-color: var(--pin); }
  .steps { display: grid; gap: 8px; margin: 14px 0 4px; padding: 12px; border-radius: 14px; background: var(--studio-2); border: 1px solid var(--studio-line); }
  .step { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; font-size: 13px; color: var(--studio-muted); }
  .step .b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--studio-line); color: var(--studio-text); }
  .step.now { color: #fff; }
  .step.now .b { background: var(--pin); }
  .step.done .b { background: var(--ok); }
  .step .hint2 { display: block; font-size: 11px; color: var(--studio-muted); }
  .player-wrap { margin: 16px auto 0; width: 322px; max-width: 100%; }
  .player { position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 26px; overflow: hidden; background: #08101c; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.06); font-family: var(--body); color: #fff; user-select: none; }
  .player svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pl-grad { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 18, 32, 0.55) 0%, rgba(11, 18, 32, 0) 30%, rgba(11, 18, 32, 0) 60%, rgba(11, 18, 32, 0.9) 100%); }
  .pl-title { position: absolute; left: 22px; right: 22px; bottom: 120px; }
  .pl-title .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.8; }
  .pl-title .t { font-family: var(--display); font-size: 40px; line-height: 0.98; font-weight: 800; letter-spacing: -0.03em; margin-top: 8px; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
  .pl-title .s { font-size: 15px; margin-top: 8px; opacity: 0.9; }
  .pl-title .d { font-family: var(--mono); font-size: 11px; margin-top: 6px; opacity: 0.7; }
  .pl-day { position: absolute; top: 26px; left: 18px; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); backdrop-filter: blur(6px); font-size: 11px; font-weight: 600; }
  .pl-card { position: absolute; left: 18px; right: 18px; top: 16%; height: 56%; border-radius: 16px; overflow: hidden; background: #000; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45); }
  .pl-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; will-change: transform, opacity; }
  .pl-cap { position: absolute; left: 18px; right: 18px; bottom: 74px; }
  .pl-cap .c { font-family: var(--display); font-size: 17px; font-weight: 700; text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6); letter-spacing: -0.01em; }
  .pl-cap .n { font-size: 12px; line-height: 1.35; margin-top: 6px; opacity: 0.94; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7); }
  .pl-outro { position: absolute; left: 18px; right: 18px; bottom: 74px; }
  .pl-outro .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.7; }
  .pl-outro .t { font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-top: 6px; }
  .pl-outro .a { font-size: 9px; opacity: 0.6; margin-top: 8px; font-family: var(--mono); }
  .pl-ctl { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px 12px; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.55)); }
  .pl-ctl button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #fff; color: #08101c; display: grid; place-items: center; font-size: 13px; }
  .pl-ctl input[type='range'] { width: 100%; accent-color: var(--pin); }
  .pl-ctl .tm { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }

  // ---------- projection ----------
  function fitProjector(points, w, h, pad) {
    const lat0 = points.reduce((s, p) => s + p[0], 0) / points.length;
    const k = Math.cos((lat0 * Math.PI) / 180);
    const xs = points.map((p) => p[1] * k), ys = points.map((p) => -p[0]);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const spanX = Math.max(maxX - minX, 1e-6), spanY = Math.max(maxY - minY, 1e-6);
    const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    const scale = Math.min(iw / spanX, ih / spanY);
    const ox = pad.l + (iw - spanX * scale) / 2, oy = pad.t + (ih - spanY * scale) / 2;
    const xy = (lat, lng) => [ox + (lng * k - minX) * scale, oy + (-lat - minY) * scale];
    return { xy, scale, mPerPx: 111320 / scale };
  }
  const pathOf = (pts, proj) => pts.map((p, i) => (i ? 'L' : 'M') + proj.xy(p[0], p[1]).map((v) => v.toFixed(1)).join(' ')).join(' ');

  // ---------- base map + pins (shared by the home map and the player) ----------
  function mapSvg(ds, o) {
    const { w, h, pad, pins, mini, provisional = [], selected, pulse, nowPin, dayFilter = 'all', worldWrap } = o;
    const anchors = pins.length ? pins.map((p) => [p.lat, p.lng]) : provisional.length ? provisional.map((p) => [p.lat, p.lng]) : [ds.center ?? [40.4433, -79.9436]];
    if (anchors.length === 1) anchors.push([anchors[0][0] + 0.03, anchors[0][1] + 0.03], [anchors[0][0] - 0.03, anchors[0][1] - 0.03]);
    const proj = fitProjector(anchors, w, h, pad);
    const strokeM = (m) => Math.max(mini ? 3 : 6, m / proj.mPerPx);
    const visible = pins.filter((p) => dayFilter === 'all' || p.day_index === dayFilter);
    const days = [...new Set(visible.map((p) => p.day_index))].sort();
    const routes = days.map((d) => {
      const pts = visible.filter((p) => p.day_index === d).sort((a, b) => a.order_index - b.order_index).map((p) => [p.lat, p.lng]);
      return pts.length > 1 ? `<path class="route" data-day="${d}" d="${pathOf(pts, proj)}" fill="none" stroke="#fff" stroke-width="${mini ? 5 : 7}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path class="route-l" d="${pathOf(pts, proj)}" fill="none" stroke="${dayColor(d)}" stroke-width="${mini ? 2.5 : 3.5}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>` : '';
    }).join('');
    const prov = provisional.length > 1 ? `<path d="${pathOf(provisional.map((p) => [p.lat, p.lng]), proj)}" fill="none" stroke="${DAY[0]}" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>` : '';
    const provPins = provisional.map((p, i) => { const [x, y] = proj.xy(p.lat, p.lng); return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="13" fill="rgba(255,255,255,0.92)" stroke="${DAY[0]}" stroke-width="2" stroke-dasharray="4 3"/><text x="0" y="0" style="font:700 11px var(--body);fill:${DAY[0]};text-anchor:middle;dominant-baseline:central">${i + 1}</text></g>`; }).join('');
    const counts = new Map(); for (const m of ds.media) if (m.pin_id) counts.set(m.pin_id, (counts.get(m.pin_id) || 0) + 1);
    const pinsSvg = visible.map((p) => {
      const [x, y] = proj.xy(p.lat, p.lng);
      const idx = visible.filter((q) => q.day_index === p.day_index).sort((a, b) => a.order_index - b.order_index).indexOf(p) + 1;
      const n = counts.get(p.id) || 0; const sel = p.id === selected; const r = mini ? (sel ? 9 : 6) : sel ? 19 : 15;
      const glyph = p.source !== 'ai' ? `<text class="glyph">${KIND_GLYPH[p.kind] || '⭐'}</text>` : `<text>${idx}</text>`;
      return `<g class="pin-g" data-act="pin" data-arg="${p.id}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
        ${p.id === pulse && !reduced ? `<circle class="pulse" r="${r}" fill="${dayColor(p.day_index)}"/>` : ''}
        ${p.id === nowPin && !mini ? `<circle r="${r + 7}" fill="none" stroke="${dayColor(p.day_index)}" stroke-opacity="0.45" stroke-width="3"/>` : ''}
        <circle r="${r}" fill="${dayColor(p.day_index)}" stroke="#fff" stroke-width="${mini ? 1.5 : 3}" vector-effect="non-scaling-stroke"/>
        ${mini ? '' : glyph}
        ${!mini && n ? `<g transform="translate(${r - 2} ${-r + 2})"><circle r="8" fill="#0f1a2b" stroke="#fff" stroke-width="2"/><text class="badge-t">${n}</text></g>` : ''}
        ${!mini && sel ? `<text class="lab" y="${-r - 9}">${esc(p.name)}</text>` : ''}
        ${!mini && p.id === nowPin ? `<g transform="translate(0 ${r + 12})"><rect x="-13" y="-7" width="26" height="13" rx="6.5" fill="#0f1a2b"/><text class="now-t" y="0.5">now</text></g>` : ''}
      </g>`;
    }).join('');
    const rivers = ds.rivers.map((r) => `<path d="${pathOf(r.pts, proj)}" fill="none" stroke="var(--water-edge)" stroke-width="${strokeM(r.w * 10) + 2}" stroke-linecap="round" stroke-linejoin="round"/><path d="${pathOf(r.pts, proj)}" fill="none" stroke="var(--water)" stroke-width="${strokeM(r.w * 10)}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
    const riverLabels = mini ? '' : ds.rivers.map((r) => { const inside = r.pts.map((q) => proj.xy(q[0], q[1])).filter(([x, y]) => x > 40 && x < w - 60 && y > pad.t && y < h - pad.b + 40); if (!inside.length) return ''; const [x, y] = inside[Math.floor(inside.length / 2)]; return `<text class="river-lab" x="${x.toFixed(1)}" y="${(y - 6).toFixed(1)}">${r.name}</text>`; }).join('');
    const parks = ds.parks.map((k) => `<path d="${pathOf(k.pts, proj)} Z" fill="var(--park)"/>`).join('');
    const grid = mini ? '' : Array.from({ length: 12 }, (_, i) => `<line x1="0" x2="${w}" y1="${(i * h) / 12}" y2="${(i * h) / 12}" stroke="#000" stroke-opacity="0.03"/><line y1="0" y2="${h}" x1="${(i * w) / 12}" x2="${(i * w) / 12}" stroke="#000" stroke-opacity="0.03"/>`).join('');
    const world = `<g id="${worldWrap || ''}">${parks}${rivers}${riverLabels}${routes}${prov}${provPins}${pinsSvg}</g>`;
    return { svg: `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><rect width="${w}" height="${h}" fill="${mini ? '#0f172a' : 'var(--ground)'}"/>${grid}${world}</svg>`, proj };

  async function dropFence() {
    if (state.ds !== PGH) { state.ds = PGH; }
    if (PGH.media.some((m) => m.id === D.fence.id)) { toast('Already landed', 'The Fence photo is on the Carnegie Mellon pin', true); return; }
    state.screen = 'map'; state.day = 'all'; state.sheet = null; state.plan = null; render();
    const pin = PGH.pins.find((p) => p.id === D.fence.pin_id); const [px, py] = mapProj.xy(pin.lat, pin.lng);
    const fab = $('#fab-add'); const ar = app.getBoundingClientRect(); const fr = fab.getBoundingClientRect();
    const fly = document.createElement('div'); fly.className = 'fly'; fly.innerHTML = `<img src="${D.fence.thumb}" alt=""/>`; fly.style.left = `${fr.left - ar.left}px`; fly.style.top = `${fr.top - ar.top - 70}px`; app.appendChild(fly);
    toast('Reading EXIF in the browser…', `DateTimeOriginal 2026:09:12 14:03:00 · GPS ${D.fence.lat}, ${D.fence.lng}`);
    await sleep(600);
    const anim = fly.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${px - (fr.left - ar.left) - 32}px, ${py - (fr.top - ar.top - 70) - 32}px) scale(0.35)`, opacity: 0.2 }], { duration: reduced ? 1 : 900, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
    await anim.finished; fly.remove();
    const dist = Math.round(hav(D.fence.lat, D.fence.lng, pin.lat, pin.lng));
    PGH.media.push({ id: D.fence.id, pin_id: pin.id, taken_at: D.fence.taken_at, lat: D.fence.lat, lng: D.fence.lng, caption: D.fence.caption, assign_method: 'auto', thumb: D.fence.thumb });
    state.pulse = pin.id; state.selected = null; render(); land(D.fence, pin, `${dist} m from ${pin.name} · within window 11:00–18:00 · day 2`);
    setTimeout(() => { state.pulse = null; if (state.screen === 'map') renderMap(); }, 3600);
  }

  async function planKyoto() {
    state.ds = KYOTO; state.screen = 'map'; state.day = 'all'; state.sheet = null; state.selected = null;
    if (KYOTO.planned) { render(); return; }
    KYOTO.pins = []; state.plan = { running: true, stage: 'Claude is drafting the itinerary…', stops: [], lines: [], dropped: [] }; render();
    await sleep(1400); state.plan.stage = 'Verifying each place on OpenStreetMap…'; renderMap();
    for (const s of KYOTO_DRAFT) {
      await sleep(850);
      if (s.lat === null) { state.plan.dropped.push(s.name); state.plan.lines.push({ drop: true, name: s.name, why: 'no OpenStreetMap match inside Kyoto' }); }
      else { state.plan.stops.push(s); state.plan.lines.push({ name: s.name, day: s.day, why: s.why }); }
      renderMap();
    }
    state.plan.stage = 'Ordering the day…'; renderMap(); await sleep(500); state.plan.stage = 'Saving pins…'; renderMap(); await sleep(500);
    let order = { 1: 0, 2: 0 };
    KYOTO.pins = state.plan.stops.map((s, i) => ({ id: 'kyoto_' + i, name: s.name, lat: s.lat, lng: s.lng, day_index: s.day, order_index: order[s.day]++, planned_start: `${addDays(KYOTO.start, s.day - 1)}T${s.s}:00`, planned_end: `${addDays(KYOTO.start, s.day - 1)}T${s.e}:00`, kind: s.kind, source: 'ai', ai_reason: s.why, place_id: 'osm:(verified · simulated)', address: null }));

    toast(`${KYOTO.pins.length} pins verified on OpenStreetMap`, `Dropped (unverified): ${state.plan.dropped.join(', ')}`, true);

  }

  async function makeVlog(label) {
    const st = state.studio; if (st.running) return; st.running = true; st.justMade = false; st.step = 0; renderStudio(); player.pause();

  }

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return; const act = el.dataset.act, arg = el.dataset.arg;
    switch (act) {
      case 'go': state.screen = arg; state.sheet = null; if (arg === 'map' && state.ds === KYOTO && !KYOTO.planned) state.ds = PGH; render(); break;
      case 'open-trip': state.ds = PGH; state.screen = 'map'; state.plan = null; state.sheet = null; render(); break;
      case 'plan-kyoto': planKyoto(); break;
      case 'day': state.day = arg === 'all' ? 'all' : Number(arg); state.selected = null; state.sheet = null; render(); break;
      case 'pin': state.selected = arg; state.sheet = 'pin'; state.tab = 'info'; render(); break;
      case 'tab': state.tab = arg; renderSheets(); break;
      case 'close': state.sheet = null; state.selected = null; state.picking = null; render(); break;
      case 'sheet': state.sheet = arg; renderSheets(); break;
      case 'beats-sheet': state.sheet = 'beats'; renderSheets(); break;
      case 'pick': state.picking = state.picking === arg ? null : arg; renderSheets(); break;
      case 'move': { const [mid, pid] = arg.split('|'); const m = PGH.media.find((x) => x.id === mid); if (m) { m.pin_id = pid; m.assign_method = 'manual'; } state.picking = null; state.selected = pid; state.sheet = 'pin'; state.tab = 'photos'; render(); toast(`Moved to ${pinName(pid)}`, 'PATCH /media/:id { pin_id } → assign_method: manual', true); break; }
      case 'drop': dropFence(); break;
      case 'add-note': { const inp = $('#note-in'); const text = inp && inp.value.trim(); if (!text) return; PGH.entries.push({ id: 'entry_new_' + Date.now(), trip_id: 'trip_pgh', pin_id: state.selected, day_index: null, text, mood: 'good', created_at: new Date().toISOString() }); renderSheets(); toast('Note saved', 'POST /pins/:id/entries — the vlog narration may now use it', true); break; }
      case 'ask': ask(arg); break;
      case 'ask-send': { const inp = $('#ask-in'); if (inp && inp.value.trim()) { const q = inp.value.trim(); inp.value = ''; ask(q); } break; }
      case 'chat': chat(arg); break;
      case 'chat-send': { const inp = $('#chat-in'); if (inp && inp.value.trim()) { const q = inp.value.trim(); inp.value = ''; chat(q); } break; }
      case 'summarize': summarize(); break;
      case 'make': makeVlog('Made now'); break;
      case 'regen': { const inp = $('#regen-in'); const v = (inp && inp.value.trim()) || 'more chill'; if (inp) inp.value = ''; makeVlog(`“${v}”`); break; }
      case 'pl-toggle': player.toggle(); break;
      case 'pl-seek': player.seek(Number(arg)); if (!player.playing) player.play(); break;
      case 'toast': toast(arg); break;
      case 'beat': { const i = Number(arg); state.beatsDone.add(i); if (state.sheet === 'beats') state.sheet = null; renderBeats(); BEATS[i].run(); break; }
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === ' ' && state.screen === 'vlog' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) { e.preventDefault(); player.toggle(); } });
  let rs; addEventListener('resize', () => { clearTimeout(rs); rs = setTimeout(() => { if (state.screen === 'map') renderMap(); }, 120); });
  render();
})();
</script>

</body>
</html>
